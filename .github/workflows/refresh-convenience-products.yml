name: Refresh convenience products

on:
  # Wake Render daily; the API starts a crawl only when 14 days have passed.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      reset_crawler_data:
        description: "Clear only crawler products and crawler-created posts before running"
        required: false
        default: false
        type: boolean

jobs:
  trigger-refresh:
    runs-on: ubuntu-latest
    # A reset can wait for an already-running full crawl to finish safely.
    timeout-minutes: 30
    steps:
      - name: Wake the API and request a scheduled refresh
        env:
          CRAWLER_REFRESH_SECRET: ${{ secrets.CRAWLER_REFRESH_SECRET }}
          RESET_CRAWLER_DATA: ${{ inputs.reset_crawler_data || 'false' }}
        run: |
          BASE_URL="https://pyeonpick.onrender.com/api/internal/crawlers/convenience"
          if [ "${RESET_CRAWLER_DATA}" = "true" ]; then
            curl --fail-with-body \
              --connect-timeout 30 \
              --max-time 1500 \
              --request POST \
              --header "X-Crawler-Secret: ${CRAWLER_REFRESH_SECRET}" \
              "${BASE_URL}/reset?wait=true"
            RUN_QUERY="?force=true"
          fi
          curl --fail-with-body \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 180 \
            --request POST \
            --header "X-Crawler-Secret: ${CRAWLER_REFRESH_SECRET}" \
            "${BASE_URL}/run${RUN_QUERY:-}"
