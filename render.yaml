services:
  - type: web
    name: pyeonpick
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /api/posts
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BOT_MODEL
        value: gpt-5.4-mini
      - key: CRAWLER_REFRESH_SECRET
        sync: false
